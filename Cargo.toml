[workspace]
resolver = "2"
members = [".", "arena-cli"]

[workspace.package]
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/arena"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[package]
name = "arena"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "N-target competitive comparison runner — fan one workload across targets, ratio + ratchet-gate, one agent-readable JSON report"

[lib]
name = "arena"
crate-type = ["rlib"]

[dependencies]
# The whole point: reuse rig's loadgen (measurement), BaselineStore (ratchet
# gate), and report envelope (worst-wins + exit ladder). meter is NOT a dep —
# the deferred runtime flavor will shell out to the `meter` CLI, not link it.
rig = { git = "https://github.com/faberline/rig", rev = "1fbe487eb4a94d745447227dbc974c3eb3e9fbd5", features = ["postgres"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# Used only by the cross-transport e2e test to pre-check pg availability and
# skip gracefully when no local Postgres is running.
postgres = "0.19"
